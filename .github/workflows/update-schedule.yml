name: 공연 일정 갱신

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 (한국 시각)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공연 일정 받기
        run: python -I scripts/fetch_schedule.py data/schedule.json
      - name: 바뀐 것이 있으면 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git diff --cached --quiet || git commit -m "공연 일정 갱신"
          git push
